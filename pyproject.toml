[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "scribe"
version = "0.1.0"
description = "OCR extraction and document processing toolkit"
authors = [
  { name = "Sean Stafford" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.9"

dependencies = [
    # CLI
    "typer>=0.9.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",

    # OCR
    "pytesseract>=0.3.10",

    # Image preprocessing
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "scikit-image>=0.21.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "page-dewarp",
    "ipywidgets>=8.0.0",
    "ipympl>=0.9.0",
]

[project.optional-dependencies]
aws = [
    "awscli>=1.32.0",
    "boto3>=1.34.0",
    "moto[s3,dynamodb,stepfunctions,textract]>=5.0.0",
]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ipykernel>=6.25.0",
]

[tool.ruff]
exclude = [
    ".cache",
    ".git",
    ".ipynb_checkpoints",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "__pycache__",
    "build",
    "data",
    "dist",
    "notebooks",
    "outs",
    "venv",
]

line-length = 100
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E731", "E501"]
fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers --disable-warnings"

[tool.coverage.run]
source = ["scribe"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]
